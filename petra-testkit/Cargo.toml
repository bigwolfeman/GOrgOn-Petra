[package]
name = "gorgon-petra-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Petra UI driver: semantic-tree query server, settle-blocking actions, identity-verified screenshots."
publish = false

[dependencies]
# Shared with the client (T033), which is importable everywhere (FR-041), so
# these stay unconditional: `wire.rs`'s request/response types and the
# `gorgon-petra` semantic-tree/frame types they wrap must be buildable with no
# feature on.
gorgon-petra = { path = "../petra" }
# `screenshot` carries its PNG as base64 text, and both sides of the wire need
# the codec: the server encodes, and a client that wants the bytes back
# decodes. Unconditional for that second reason — a `testkit`-gated base64
# would leave the importable client (FR-041) holding a string it cannot open.
base64 = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Server-only, so the endpoint cannot exist in a build that did not ask
# (FR-042). `gorgon-petra-egui` is not touched by `src/server/` itself today —
# `frame.rs`/`hub.rs` read only `gorgon_petra::frame::PetrifiedFrame` — but the
# feature carries it because the driver's own integration tests need a real
# `Host` to produce a real frame over the real socket, and because T030's
# `inject.rs` and T032's `snapshot/` (both under this feature) need it too.
gorgon-petra-egui = { path = "../petra-egui", optional = true }
# `src/bridge.rs` holds a clone of the application's `egui::Context` so a job
# queued into an idle window can wake it (`Context::request_repaint` is the
# documented thread-safe wake-up, and Petra paints no frames at idle by
# design). That is a non-test use of `egui`, so it cannot ride on the
# dev-dependency below. Optional, and reached only through `testkit`: the
# client half of this crate (FR-041) must still build with no feature on.
egui = { version = "0.36.1", optional = true }
# T032's `src/snapshot/`: real pixels, through `egui`'s own tessellator and
# `egui_wgpu`'s own pipeline, on a headless `wgpu` device.
egui-wgpu = { version = "0.36.1", optional = true, default-features = false }
# Declared here rather than left to `egui-wgpu`'s own `wgpu` line, because
# that line asks for `["std", "wgsl"]` and *no backend*: which backends exist
# is the embedder's choice, and a snapshot lane with none compiled in finds no
# adapter and fails every capture. `PRIMARY | GL` is what `snapshot/gpu.rs`
# asks the instance for. Already in the lock graph at 30.0.0 through
# `eframe`'s `wgpu` feature, so this adds no download.
wgpu = { version = "30.0", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
    "gles",
] }
# wgpu expresses device bring-up as two `async` calls. A capture runs on the
# UI thread, which is not a tokio context, so blocking on those two futures
# is the honest shape — the same one `egui_kittest` uses.
pollster = { version = "1.0", optional = true }
# PNG encoding for the `screenshot` result, and PNG decoding in the snapshot
# tests, which assert on the pixels that came back rather than on a byte
# count.
image = { workspace = true, optional = true }
nix = { workspace = true, optional = true }

[dev-dependencies]
# The server's own tests drive a real socket with a real client, so they need
# the same NDJSON codec the future T033 client will ship — reading it by hand
# here would be exactly the "hand-rolled per-test socket code" the contract
# calls a review-rejectable defect. `tokio-util`'s `LinesCodec` equivalent is
# not pulled in for that reason either; the tests read/write NDJSON with the
# same `AsyncBufReadExt`/`AsyncWriteExt` primitives `server/mod.rs` uses.
tempfile.workspace = true
# `tests/server.rs` drives a real `gorgon-petra-egui::host::Host` headlessly
# (`gorgon/petra-egui/examples/gallery.rs`'s own test pattern) to get a real
# `PetrifiedFrame` to publish and query — the wave brief's "a test that calls
# a handler function directly proves nothing" applies just as much to a
# hand-built frame as to a hand-built request. That needs `egui::Context`
# directly, not only the version `gorgon-petra-egui` already pulls in
# transitively.
egui = "0.36.1"
# T044/T045's `tests/inspector_journey.rs` / `tests/inspector_reconnect.rs`
# host the real `gorgon-inspector::app::Shell` (via `support::inspector`)
# under this crate's own `DriverHost` — never a hand-built subset of
# panels. `gorgond` itself is *not* listed here: `CARGO_BIN_EXE_<name>` only
# populates for a binary in the *same* package as the test, never for one in
# a dependency, so `support::gorgond` instead builds it with a `cargo build
# --message-format=json` subprocess and reads the artifact path back — see
# that module's own doc for why. Dev-only, same as `egui` above: nothing
# under `src/` names `gorgon-inspector`.
gorgon-inspector = { path = "../inspector" }

[features]
# The driver endpoint exists only when this feature is on. Production binaries
# must not enable it: contracts/driver-protocol.md forbids a runtime switch.
default = []
testkit = [
    "dep:gorgon-petra-egui",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:image",
    "dep:nix",
    "dep:pollster",
    "dep:wgpu",
]

[[test]]
name = "server"
required-features = ["testkit"]

# T035's acceptance journey needs the same real driver server `server.rs`
# does — see that entry's own reasoning, which applies here unchanged.
[[test]]
name = "journey"
required-features = ["testkit"]

# T044: the US3 acceptance journey against a real, subprocess-booted
# `gorgond` — needs the real driver server the same way `journey` does.
[[test]]
name = "inspector_journey"
required-features = ["testkit"]

# T045: daemon-restart honesty, on the harness T044 owns.
[[test]]
name = "inspector_reconnect"
required-features = ["testkit"]

# T036's production-exclusion proof is the mirror image of the two entries
# above: it exists specifically to prove the *no*-feature shape, so it must
# build and run with no feature on, the same way `tests/driver.rs` does —
# deliberately no `[[test]]` entry here, so cargo's default auto-discovery
# picks it up unconditionally rather than requiring `testkit` the way
# `server`/`journey` do.

[lints]
workspace = true
