[workspace]
resolver = "2"
members = [
    "petra",
    "petra-compound",
    "petra-egui",
    "petra-testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/bigwolfeman/GOrgOn-Petra"
rust-version = "1.95"

[workspace.lints.rust]
missing_docs = "warn"
# `gorgon-petra`'s Kani proof harnesses (`geom.rs`, `layout/constraints.rs`,
# `tree/node.rs`) are gated `#[cfg(kani)]`, which only the `kani` tool itself
# defines. Plain `rustc`/`clippy` has never heard of it, so every ordinary
# build warned `unexpected_cfgs` — silent under the default `warn` level,
# fatal under `-D warnings`. This declares the name expected, the fix
# `clippy`'s own diagnostic names, without weakening `unexpected_cfgs` for
# any other, genuinely unexpected cfg. Pre-existing, unrelated to the rule
# material change that surfaced it: confirmed via `git show HEAD` that the
# three `#[cfg(kani)]` sites predate this change.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
base64 = "0.22"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
nix = { version = "0.30", features = ["socket", "uio", "user", "signal", "process"] }
proptest = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
