[package]
name = "gorgon-petra-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The only crate that knows egui: eframe host, layer painting, text shaping, input translation for Petra."
publish = false

[dependencies]
egui = "0.36.1"
gorgon-petra = { path = "../petra" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "web_screen_reader",
    "wgpu",
] }

[lints]
workspace = true
