[package]
name = "gorgon-petra-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Above the workspace floor: egui/eframe/ecolor 0.36.1 require 1.95. This is
# the only crate that pulls them, so it is the only crate that pays for them.
rust-version = "1.95"
description = "The only crate that knows egui: eframe host, layer painting, text shaping, input translation for Petra."
publish = false

[dependencies]
egui = "0.36.1"
gorgon-petra = { path = "../petra" }
# The gallery's own compound pages host `gorgon-petra-compound`'s triples
# directly (spec 009 T006/T018/T019/T028a/T032's five). This crate depends on
# `gorgon-petra` and `serde` only, so it carries no egui and nothing from
# `gorgon/` — D-069 survives.
gorgon-petra-compound = { path = "../petra-compound" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The system file dialog, and the only host-facing crate in this workspace
# that opens one. `xdg-portal` rather than the default `gtk3`: the portal is
# what a Wayland session actually uses, it needs no GTK at build time, and it
# is the path a sandboxed build would have to take anyway. Native-only for
# eframe's reason — a browser has its own picker and no path to hand back.
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "tokio",
] }
# `accesskit` enables `egui-winit/accesskit`, the platform-adapter feature
# that actually publishes an `accesskit::TreeUpdate` to the OS screen
# reader. `egui-winit` is native-only (see eframe's own target split), so
# this is a no-op on wasm32 and is not requested there; wasm's AT story is
# `web_screen_reader` (D-072), unrelated to this crate.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "web_screen_reader",
    "wgpu",
] }

[lints]
workspace = true

# `test = true` so the assertions at the bottom of the gallery run under
# `cargo test --all-targets`, which is what the default gate lane executes.
# Without it an example is only ever type-checked, and a harness nothing runs
# is a harness that rots.
[[example]]
name = "gallery"
test = true

# The 42-row gallery scaffold (spec 005 T004). Declared rather than left to
# Cargo's auto-discovery so it is visible in the manifest beside the example it
# will eventually replace: 323 parity cells do not fit in an `examples/` target,
# because an example is a single file Cargo will not let you split into modules.
# The example above stays until a later task migrates it.
[[bin]]
name = "gallery"
path = "src/bin/gallery/main.rs"
test = true

# The web half of the parity example (T060). `eframe` re-exports `web_sys` and
# `wasm_bindgen`, but only as types — the `#[wasm_bindgen]` attribute needs the
# macro crate in scope by its own name, `spawn_local` lives in
# `wasm-bindgen-futures`, and `web_sys::console` is behind a feature `eframe`
# does not request. All three resolve to versions already in `Cargo.lock`, and
# the `wasm-bindgen` pin must keep matching the `wasm-bindgen` CLI that
# processes the artifact: a mismatch fails the bundle step, not the build.
# Native-only, test-only: the headless GPU snapshotter. This is what lets the
# gallery's own tests rasterize a catalog page to real pixels and assert about
# them, instead of asserting about the frame record and hoping the painter
# agrees. `gorgon-petra-testkit` depends on this crate in return, which Cargo
# allows for a dev-dependency and which keeps the snapshotter out of every
# shipped artifact.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gorgon-petra-testkit = { path = "../petra-testkit", features = ["testkit"] }
image = "0.25"
# Monorepo-only, test-only, same shape as `gorgon-petra-testkit`'s own three
# removed integration tests (`petra/README.md`'s Provenance section):
# `gorgon-kernel-lua` lives at `gorgon/kernel-lua`, which exists only inside
# the private GOrgOn monorepo this crate is filtered out of to publish
# `GOrgOn-Petra`. `src/bin/gallery/lua_parity.rs` is what needs it — the
# Lua/Rust tree-equality harness for spec 013 (`ctx.ui` builds a page's body,
# `body()` builds the same page in Rust, and the harness asserts the two
# `ViewNode` trees match). A production dependency in this direction would
# break `cargo xtask petra-boundary`'s egui-never-reaches-`gorgon-petra` rule
# in spirit even though the gate itself only walks `gorgon-petra`'s graph;
# scoping it to `dev-dependencies` keeps it out of every shipped artifact and
# out of the standalone `petra/` workspace's own build, the same way the
# testkit's dependency on `gorgon-inspector` was. When `petra/` is mirrored
# out, this line and `lua_parity.rs` are removed together, exactly like that
# precedent — not silently broken and not shipped.
gorgon-kernel-lua = { path = "../../gorgon/kernel-lua" }
# `gorgon-kernel-lua`'s own `Lua`/`Table`/`Value` types are `mlua` types, so
# `lua_parity.rs` needs the same crate directly rather than only through
# `gorgon-kernel-lua`'s re-export surface (it has none for these).
#
# Spelled out rather than `{ workspace = true }`, and that is not a style
# choice. `petra/` is its own workspace as well as a member of the monorepo's,
# and `petra/Cargo.toml`'s `[workspace.dependencies]` does not declare `mlua`
# — only the superproject's does. Inheriting here parses from the monorepo
# root and fails outright the moment anything treats `petra/Cargo.toml` as the
# workspace root, which `cargo xtask petra-boundary`,
# `petra-compound-boundary` and `petra-testkit`'s own `exclusion` tests all
# do. Version and features are copied from the superproject root verbatim so
# the resolver still unifies on one Luau build.
mlua = { version = "0.11", features = ["luau", "vendored", "serialize", "async", "send"] }
# `serde_json::from_value::<ViewNode>` — the deserialize half of the round
# trip `lua_parity.rs` runs, the same call `gorgon_kernel_lua::ui::mod.rs`'s
# own `build()` helper makes.
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "console",
] }

# `test = true` so the assertions at the bottom of the parity example run under
# `cargo test --all-targets`, the same reason `gallery` declares it. An example
# nothing runs is an example that rots — and this one's whole job is to still
# be true a year from now.
[[example]]
name = "parity"
test = true
