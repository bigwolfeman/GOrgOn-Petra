[package]
name = "gorgon-petra-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The only crate that knows egui: eframe host, layer painting, text shaping, input translation for Petra."
publish = false

[dependencies]
egui = "0.36.1"
gorgon-petra = { path = "../petra" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `accesskit` enables `egui-winit/accesskit`, the platform-adapter feature
# that actually publishes an `accesskit::TreeUpdate` to the OS screen
# reader. `egui-winit` is native-only (see eframe's own target split), so
# this is a no-op on wasm32 and is not requested there; wasm's AT story is
# `web_screen_reader` (D-072), unrelated to this crate.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "web_screen_reader",
    "wgpu",
] }

[lints]
workspace = true

# `test = true` so the assertions at the bottom of the gallery run under
# `cargo test --all-targets`, which is what the default gate lane executes.
# Without it an example is only ever type-checked, and a harness nothing runs
# is a harness that rots.
[[example]]
name = "gallery"
test = true

# The web half of the parity example (T060). `eframe` re-exports `web_sys` and
# `wasm_bindgen`, but only as types — the `#[wasm_bindgen]` attribute needs the
# macro crate in scope by its own name, `spawn_local` lives in
# `wasm-bindgen-futures`, and `web_sys::console` is behind a feature `eframe`
# does not request. All three resolve to versions already in `Cargo.lock`, and
# the `wasm-bindgen` pin must keep matching the `wasm-bindgen` CLI that
# processes the artifact: a mismatch fails the bundle step, not the build.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "console",
] }

# `test = true` so the assertions at the bottom of the parity example run under
# `cargo test --all-targets`, the same reason `gallery` declares it. An example
# nothing runs is an example that rots — and this one's whole job is to still
# be true a year from now.
[[example]]
name = "parity"
test = true
